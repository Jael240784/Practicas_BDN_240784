name: ${COMPOSE_PROJECT_NAME:-gonzalez240784}
services:
  postgres:
    image: postgres:18.6
    container_name: gonzalez240784_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "40784:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gonzalez_net]

  mysql:
    image: mysql:8.4
    container_name: gonzalez240784_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_ADMIN_USER}
      MYSQL_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
    ports:
      - "40785:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [gonzalez_net]

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: gonzalez240784_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "40786:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [gonzalez_net]

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: gonzalez240784_pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "40787:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gonzalez_net]

volumes:
  mysql_data:
    name: gonzalez240784_mysql_data
  postgres_data:
    name: gonzalez240784_postgres_data
  pgadmin_data:
    name: gonzalez240784_pgadmin_data

networks:
  gonzalez_net:
    name: gonzalez240784_net
